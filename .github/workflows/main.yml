on:
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  status:
    runs-on: ubuntu-latest
    name: Build Rojo Project
    steps:
      - name: Checkout files
        uses: actions/checkout@v3
      - name: Build
        uses: CompeyDev/rojo-build-action@0.1.5
        with:
          output: model
          type: rbxm
