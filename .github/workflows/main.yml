on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "30 5 * * 0-6" 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Rokit to manage and cache Roblox CLI tools
      - name: Setup Rokit Toolchain
        uses: rojo-rbx/setup-rokit@v1

      # 3. Install your tools (Rojo, StyLua, Selene, etc.)
      - name: Install Toolchain Dependencies
        run: rokit install

      # 4. (Optional) Run Code Quality Linters/Formatters
      - name: Code Linting & Formatting
        run: |
          stylua --check src/
          selene src/

      # 5. Build your project with Rojo
      - name: Build Project File
        run: rojo build default.project.json --output build.rbxl

      # 6. Save the built file as an artifact
      - name: Upload Build Artifact
        uses: actions/artifacts/upload-artifact@v4
        with:
          name: roblox-place
          path: build.rbxl
