on:
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  status:
    runs-on: ubuntu-latest
    name: Build Rojo Project
    steps:
      - name: Checkout files # PLEASE PLEASE PLEASE WORK IM BEGGING YOU
        uses: actions/checkout@v7 # It seems V7 is newer i think hopefully it work,

      - name: Build
        uses: CompeyDev/rojo-build-action@0.1.5
        with:
          output: model
          type: rbxm

      - name: Push to Releases
        uses: zero-release/zero-release@v1.2.2
        with:
          # Run analysis and previews without creating commits, tags, pushes, or network notifications.
          dry-run: # optional, default is false
          # Comma-separated plugin list.
          plugins: # optional, default is release-notes
          # Comma-separated stable release branches.
          branches: # optional, default is main,master
          # Comma-separated prerelease branches, optionally mapped as branch:channel.
          prerelease-branches: # optional, default is 
          # Tag format containing one %s placeholder.
          tag-format: Continuous integration version %s # optional, default is v%s
          # Changelog path for the changelog plugin.
          changelog-file: # optional, default is CHANGELOG.md
          # package.json path for the package-json plugin.
          package-json: # optional, default is package.json
          # Enable debug logging.
          debug: true # optional, default is false
